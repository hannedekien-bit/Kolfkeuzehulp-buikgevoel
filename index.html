<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FAF6F1;
    --blush: #F2D9CC;
    --rose: #C97B6A;
    --deep: #3D2B26;
    --sage: #7D9B82;
    --sage-light: #C4D9C7;
    --warm-white: #FDFAF7;
    --border: #E8D8CE;
    --text: #4A3830;
    --text-light: #8A6F66;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--cream);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--warm-white);
    border-bottom: 1px solid var(--border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-dot {
    width: 36px; height: 36px;
    background: var(--rose);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    color: var(--deep);
  }

  header p {
    font-size: 0.75rem;
    color: var(--text-light);
    font-weight: 300;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  /* INTRO */
  .intro {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeUp 0.6s ease both;
  }

  .intro h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--deep);
    line-height: 1.3;
    margin-bottom: 12px;
  }

  .intro p {
    color: var(--text-light);
    font-weight: 300;
    font-size: 0.95rem;
    line-height: 1.7;
  }

  /* PROGRESS */
  .progress-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 36px;
    justify-content: center;
    animation: fadeUp 0.6s 0.1s ease both;
  }

  .progress-step {
    height: 4px;
    flex: 1;
    max-width: 60px;
    border-radius: 2px;
    background: var(--blush);
    transition: background 0.4s;
  }

  .progress-step.active { background: var(--rose); }
  .progress-step.done { background: var(--sage); }

  /* CARD */
  .card {
    background: var(--warm-white);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s ease both;
  }

  .question-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--rose);
    font-weight: 500;
    margin-bottom: 10px;
  }

  .question-text {
    font-family: 'Playfair Display', serif;
    font-size: 1.2rem;
    color: var(--deep);
    line-height: 1.5;
    margin-bottom: 8px;
  }

  .question-hint {
    font-size: 0.82rem;
    color: var(--text-light);
    font-weight: 300;
    margin-bottom: 24px;
    line-height: 1.6;
  }

  /* OPTIONS */
  .options {
    display: grid;
    gap: 10px;
  }

  .options.two-col { grid-template-columns: 1fr 1fr; }

  .option-btn {
    background: var(--cream);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 18px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    color: var(--text);
    line-height: 1.4;
    position: relative;
  }

  .option-btn .opt-icon {
    font-size: 1.3rem;
    display: block;
    margin-bottom: 4px;
  }

  .option-btn .opt-label {
    font-weight: 500;
    display: block;
    margin-bottom: 2px;
  }

  .option-btn .opt-sub {
    font-size: 0.78rem;
    color: var(--text-light);
    font-weight: 300;
  }

  .option-btn:hover {
    border-color: var(--rose);
    background: #FDF0EB;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(201,123,106,0.12);
  }

  .option-btn.selected {
    border-color: var(--rose);
    background: #FDF0EB;
    box-shadow: 0 0 0 3px rgba(201,123,106,0.15);
  }

  .option-btn.selected::after {
    content: '✓';
    position: absolute;
    top: 12px; right: 14px;
    color: var(--rose);
    font-weight: 700;
    font-size: 0.9rem;
  }

  /* MULTI SELECT NOTE */
  .multi-note {
    font-size: 0.75rem;
    color: var(--text-light);
    margin-bottom: 14px;
    font-style: italic;
  }

  /* NAV BUTTONS */
  .nav-row {
    display: flex;
    gap: 12px;
    margin-top: 28px;
    justify-content: flex-end;
  }

  .btn-back {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 24px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    color: var(--text-light);
    transition: all 0.2s;
  }

  .btn-back:hover { border-color: var(--text-light); color: var(--text); }

  .btn-next {
    background: var(--rose);
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    color: white;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 8px;
  }

  .btn-next:hover { background: #B86D5C; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(201,123,106,0.3); }
  .btn-next:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }

  /* RESULTS */
  .results-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .results-header .badge {
    display: inline-block;
    background: var(--sage-light);
    color: var(--sage);
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .results-header h2 {
    font-family: 'Playfair Display', serif;
    font-size: 1.7rem;
    color: var(--deep);
  }

  .pump-card {
    background: var(--warm-white);
    border: 1.5px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    margin-bottom: 16px;
    animation: fadeUp 0.5s ease both;
    position: relative;
    overflow: hidden;
  }

  .pump-card.rank-1 {
    border-color: var(--rose);
    box-shadow: 0 4px 20px rgba(201,123,106,0.15);
  }

  .pump-card.rank-1::before {
    content: '★ Beste match';
    position: absolute;
    top: 0; right: 0;
    background: var(--rose);
    color: white;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 6px 16px;
    border-radius: 0 20px 0 12px;
    letter-spacing: 0.05em;
  }

  .pump-card.rank-2 { border-color: var(--sage); }
  .pump-card.rank-2::before {
    content: '✦ Goede keuze';
    position: absolute;
    top: 0; right: 0;
    background: var(--sage);
    color: white;
    font-size: 0.72rem;
    font-weight: 500;
    padding: 6px 16px;
    border-radius: 0 20px 0 12px;
    letter-spacing: 0.05em;
  }

  .pump-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    color: var(--deep);
    margin-bottom: 4px;
    margin-top: 6px;
  }

  .pump-brand {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-light);
    margin-bottom: 14px;
    font-weight: 300;
  }

  .score-bar-wrap {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
  }

  .score-bar {
    flex: 1;
    height: 6px;
    background: var(--blush);
    border-radius: 3px;
    overflow: hidden;
  }

  .score-fill {
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--rose), #E8A090);
    transition: width 1s ease;
  }

  .pump-card.rank-2 .score-fill {
    background: linear-gradient(90deg, var(--sage), var(--sage-light));
  }

  .score-label {
    font-size: 0.78rem;
    font-weight: 500;
    color: var(--rose);
    min-width: 30px;
    text-align: right;
  }

  .pump-card.rank-2 .score-label { color: var(--sage); }

  .pump-tags {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 14px;
  }

  .tag {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 0.74rem;
    color: var(--text);
  }

  .pump-pros {
    font-size: 0.85rem;
    color: var(--text-light);
    line-height: 1.7;
    font-weight: 300;
  }

  .pump-pros strong {
    color: var(--text);
    font-weight: 500;
  }

  .pump-available {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    background: var(--sage-light);
    color: #4A7A52;
    font-size: 0.75rem;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: 500;
  }

  /* RESTART */
  .restart-row {
    text-align: center;
    margin-top: 32px;
  }

  .btn-restart {
    background: none;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 28px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    color: var(--text-light);
    transition: all 0.2s;
  }

  .btn-restart:hover { border-color: var(--rose); color: var(--rose); }

  /* CONSULT CTA */
  .consult-cta {
    background: linear-gradient(135deg, #3D2B26, #5A3F38);
    border-radius: 20px;
    padding: 28px;
    text-align: center;
    margin-top: 24px;
    color: white;
  }

  .consult-cta h3 {
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    margin-bottom: 8px;
  }

  .consult-cta p {
    font-size: 0.85rem;
    opacity: 0.75;
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 16px;
  }

  .btn-consult {
    background: var(--rose);
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 500;
    color: white;
    transition: all 0.2s;
  }

  .btn-consult:hover { background: #E08878; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 500px) {
    .options.two-col { grid-template-columns: 1fr; }
    .card { padding: 24px; }
    header { padding: 16px 20px; }
    .intro h2 { font-size: 1.5rem; }
  }
</style>
</head>

function buildProgressBar() {
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const step = document.createElement('div');
    step.className = 'progress-step' +
      (i < currentQuestion ? ' done' : i === currentQuestion ? ' active' : '');
    bar.appendChild(step);
  });
}

function renderQuestion() {
  buildProgressBar();
  const q = QUESTIONS[currentQuestion];
  const area = document.getElementById('quizArea');

  const selectedVals = answers[q.id] || [];

  const optionsHtml = q.options.map(opt => {
    const sel = Array.isArray(selectedVals)
      ? selectedVals.includes(opt.value)
      : selectedVals === opt.value;
    return `
      <button class="option-btn${sel ? ' selected' : ''}" onclick="selectOption('${q.id}', '${opt.value}', ${q.multi})">
        <span class="opt-icon">${opt.icon}</span>
        <span class="opt-label">${opt.label}</span>
        ${opt.sub ? `<span class="opt-sub">${opt.sub}</span>` : ''}
      </button>`;
  }).join('');

  area.innerHTML = `
    <div class="card">
      <div class="question-label">Vraag ${currentQuestion + 1} van ${QUESTIONS.length} – ${q.label}</div>
      <div class="question-text">${q.text}</div>
      <div class="question-hint">${q.hint}</div>
      ${q.multi ? '<div class="multi-note">Je kunt meerdere opties selecteren</div>' : ''}
      <div class="options${q.options.length === 2 ? '' : (q.options.length <= 4 && !q.multi ? ' two-col' : '')}">
        ${optionsHtml}
      </div>
      <div class="nav-row">
        ${currentQuestion > 0 ? '<button class="btn-back" onclick="goBack()">← Vorige</button>' : ''}
        <button class="btn-next" id="nextBtn" onclick="goNext()" ${!hasAnswer(q.id, q.multi) ? 'disabled' : ''}>
          ${currentQuestion < QUESTIONS.length - 1 ? 'Volgende →' : 'Bekijk mijn advies ✨'}
        </button>
      </div>
    </div>`;
}

function hasAnswer(id, multi) {
  if (multi) return answers[id] && answers[id].length > 0;
  return !!answers[id];
}

function selectOption(id, value, multi) {
  if (multi) {
    if (!answers[id]) answers[id] = [];
    const idx = answers[id].indexOf(value);
    if (idx > -1) answers[id].splice(idx, 1);
    else answers[id].push(value);
  } else {
    answers[id] = value;
  }
  renderQuestion();
}

function goBack() {
  if (currentQuestion > 0) { currentQuestion--; renderQuestion(); }
}

function goNext() {
  const q = QUESTIONS[currentQuestion];
  if (!hasAnswer(q.id, q.multi)) return;
  if (currentQuestion < QUESTIONS.length - 1) {
    currentQuestion++;
    renderQuestion();
  } else {
    showResults();
  }
}

function scoreAllPumps() {
  return PUMPS.map(pump => {
    let total = 0;
    let max = 0;

    QUESTIONS.forEach(q => {
      const ans = answers[q.id];
      const scoreMap = pump.scores[q.id] || {};
      if (q.multi && Array.isArray(ans)) {
        ans.forEach(v => { total += (scoreMap[v] || 0); max += 10; });
        if (ans.length === 0) max += 0;
      } else if (ans) {
        total += (scoreMap[ans] || 0);
        max += 10;
      }
    });

    const pct = max > 0 ? Math.round((total / max) * 100) : 0;
    return { ...pump, score: pct };
  }).sort((a, b) => b.score - a.score);
}

function showResults() {
  buildProgressBar();
  document.querySelectorAll('.progress-step').forEach(s => s.classList.add('done'));

  const ranked = scoreAllPumps();
  const top = ranked.slice(0, 3);

  const area = document.getElementById('quizArea');
  area.innerHTML = `
    <div class="results-header">
      <div class="badge">Jouw persoonlijk advies</div>
      <h2>Dit zijn jouw beste opties</h2>
    </div>
    ${top.map((pump, i) => renderPumpCard(pump, i)).join('')}
    <div class="consult-cta">
      <h3>Wil je het zeker weten?</h3>
      <p>Tijdens een kolfconsult bij onze vroedvrouwen kan je deze kolven <strong>uitproberen</strong> en een persoonlijk advies op maat krijgen.</p>
      <button class="btn-consult">Plan een kolfconsult 📅</button>
    </div>
    <div class="restart-row">
      <button class="btn-restart" onclick="restart()">↺ Opnieuw beginnen</button>
    </div>
  `;

  // Animate score bars
  setTimeout(() => {
    top.forEach((pump, i) => {
      const fill = document.getElementById('fill_' + pump.id);
      if (fill) fill.style.width = pump.score + '%';
    });
  }, 100);
}

function renderPumpCard(pump, rank) {
  const rankClass = rank === 0 ? 'rank-1' : rank === 1 ? 'rank-2' : '';
  return `
    <div class="pump-card ${rankClass}">
      <div class="pump-brand">${pump.brand}</div>
      <div class="pump-name">${pump.name}</div>
      <div class="score-bar-wrap">
        <div class="score-bar">
          <div class="score-fill" id="fill_${pump.id}" style="width:0%"></div>
        </div>
        <div class="score-label">${pump.score}%</div>
      </div>
      <div class="pump-tags">${pump.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
      <div class="pump-pros">${pump.pros}</div>
      ${pump.available ? '<div class="pump-available">✓ Beschikbaar om te testen in onze praktijk</div>' : ''}
    </div>`;
}

function restart() {
  currentQuestion = 0;
  answers = {};
  renderQuestion();
}

// Init
renderQuestion();
</script>
